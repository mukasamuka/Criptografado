<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteúdo Protegido</title>
<script src="https://cdn.jsdelivr.net/npm/argon2-browser/dist/argon2-bundled.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap');

      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

      :root {
        --red:       #ff0033;
        --red2:      #ff3355;
        --red-dark:  #cc0022;
        --red-dim:   rgba(255,0,51,0.15);
        --red-glow:  rgba(255,0,51,0.6);
        --bg:        #050008;
        --surface:   #0d0010;
        --border:    rgba(255,0,51,0.25);
        --text:      #ffe0e5;
        --muted:     rgba(255,200,210,0.45);
      }

      body {
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* Scanlines overlay */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255,0,51,0.018) 2px,
          rgba(255,0,51,0.018) 4px
        );
        pointer-events: none;
        z-index: 0;
      }

      /* Radial glow background */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,0,51,0.12) 0%, transparent 70%),
          radial-gradient(ellipse 100% 80% at 50% 100%, rgba(150,0,30,0.2) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
      }

      /* Animated corner brackets */
      .corner { position: fixed; width: 60px; height: 60px; pointer-events: none; z-index: 1; }
      .corner::before, .corner::after { content: ''; position: absolute; background: var(--red); }
      .corner::before { width: 2px; height: 100%; }
      .corner::after  { width: 100%; height: 2px; }
      .corner.tl { top: 20px; left: 20px; }
      .corner.tl::before { top: 0; left: 0; }
      .corner.tl::after  { top: 0; left: 0; }
      .corner.tr { top: 20px; right: 20px; transform: scaleX(-1); }
      .corner.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
      .corner.br { bottom: 20px; right: 20px; transform: scale(-1); }

      @keyframes cornerPulse {
        0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--red); }
        50%       { opacity: 0.4; box-shadow: 0 0 2px var(--red); }
      }
      .corner::before, .corner::after {
        box-shadow: 0 0 8px var(--red), 0 0 16px var(--red-glow);
        animation: cornerPulse 2s ease-in-out infinite;
      }

      /* Floating particles */
      .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
      .p {
        position: absolute;
        width: 2px; height: 2px;
        background: var(--red);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--red);
        animation: floatUp linear infinite;
        opacity: 0;
      }
      @keyframes floatUp {
        0%   { transform: translateY(100vh) scale(0); opacity: 0; }
        10%  { opacity: 0.8; }
        90%  { opacity: 0.3; }
        100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
      }

      /* Main box */
      .box {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 400px;
        margin: 0 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(255,0,51,0.08),
          0 0 40px rgba(255,0,51,0.2),
          0 0 80px rgba(255,0,51,0.08),
          inset 0 1px 0 rgba(255,0,51,0.15);
        animation: boxIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
      }

      @keyframes boxIn {
        from { opacity: 0; transform: translateY(30px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Top accent bar */
      .accent-bar {
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--red), var(--red2), var(--red), transparent);
        box-shadow: 0 0 20px var(--red-glow), 0 0 40px rgba(255,0,51,0.4);
        animation: barGlow 2s ease-in-out infinite;
      }

      @keyframes barGlow {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.6; }
      }

      /* Header section */
      .box-header {
        padding: 32px 36px 24px;
        text-align: center;
        border-bottom: 1px solid rgba(255,0,51,0.1);
        position: relative;
      }

      .lock-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px; height: 72px;
        background: rgba(255,0,51,0.08);
        border: 1px solid rgba(255,0,51,0.3);
        border-radius: 50%;
        margin-bottom: 18px;
        position: relative;
        box-shadow: 0 0 30px rgba(255,0,51,0.25), inset 0 0 20px rgba(255,0,51,0.05);
        animation: lockPulse 3s ease-in-out infinite;
      }

      @keyframes lockPulse {
        0%, 100% { box-shadow: 0 0 30px rgba(255,0,51,0.25), inset 0 0 20px rgba(255,0,51,0.05); }
        50%       { box-shadow: 0 0 50px rgba(255,0,51,0.5), inset 0 0 30px rgba(255,0,51,0.1); }
      }

      .lock-wrap::after {
        content: '';
        position: absolute;
        inset: -6px;
        border: 1px solid rgba(255,0,51,0.15);
        border-radius: 50%;
        animation: ringExpand 3s ease-in-out infinite;
      }

      @keyframes ringExpand {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50%       { transform: scale(1.1); opacity: 0.1; }
      }

      .lock-icon { font-size: 32px; line-height: 1; }

      .title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 28px;
        letter-spacing: 3px;
        color: #fff;
        text-shadow:
          0 0 10px var(--red),
          0 0 20px rgba(255,0,51,0.5),
          0 0 40px rgba(255,0,51,0.2);
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 0.5px;
        line-height: 1.5;
      }

      /* Body section */
      .box-body { padding: 28px 36px 32px; }

      .field-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--red2);
        margin-bottom: 10px;
      }

      .field-label::before {
        content: '';
        width: 12px; height: 1px;
        background: var(--red);
        box-shadow: 0 0 4px var(--red);
      }

      .inp-wrap {
        position: relative;
        margin-bottom: 20px;
      }

      .inp-wrap input {
        width: 100%;
        background: rgba(255,0,51,0.04);
        border: 1px solid rgba(255,0,51,0.2);
        border-radius: 3px;
        padding: 14px 48px 14px 16px;
        color: var(--text);
        font-family: 'Rajdhani', sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 1px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        caret-color: var(--red);
      }

      .inp-wrap input::placeholder { color: rgba(255,200,210,0.3); letter-spacing: 0.5px; }

      .inp-wrap input:focus {
        border-color: var(--red);
        background: rgba(255,0,51,0.07);
        box-shadow:
          0 0 0 3px rgba(255,0,51,0.12),
          0 0 20px rgba(255,0,51,0.1),
          inset 0 0 10px rgba(255,0,51,0.04);
      }

      .eye-btn {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255,200,210,0.4);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        transition: color 0.2s;
        padding: 4px;
      }

      .eye-btn:hover { color: var(--red2); }

      /* Unlock button */
      .btn-unlock {
        width: 100%;
        position: relative;
        background: linear-gradient(135deg, #cc0022 0%, #ff0033 40%, #ff3355 60%, #cc0022 100%);
        background-size: 200% 100%;
        border: none;
        border-radius: 3px;
        padding: 15px 24px;
        color: #fff;
        font-family: 'Bebas Neue', sans-serif;
        font-size: 20px;
        letter-spacing: 3px;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.3s;
        box-shadow:
          0 0 20px rgba(255,0,51,0.4),
          0 0 40px rgba(255,0,51,0.2),
          0 4px 15px rgba(255,0,51,0.3);
        animation: btnShift 3s ease infinite;
      }

      @keyframes btnShift {
        0%, 100% { background-position: 0% 50%; }
        50%       { background-position: 100% 50%; }
      }

      .btn-unlock::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        transition: left 0.4s;
      }

      .btn-unlock:hover::before { left: 100%; }

      .btn-unlock:hover {
        transform: translateY(-2px);
        box-shadow:
          0 0 30px rgba(255,0,51,0.7),
          0 0 60px rgba(255,0,51,0.35),
          0 8px 25px rgba(255,0,51,0.4);
      }

      .btn-unlock:active { transform: translateY(0); }

      /* Error message */
      .err-msg {
        display: none;
        align-items: center;
        gap: 10px;
        background: rgba(255,0,51,0.08);
        border: 1px solid rgba(255,0,51,0.3);
        border-radius: 3px;
        padding: 11px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #ff6680;
        margin-top: 14px;
        letter-spacing: 0.3px;
        animation: errShake 0.4s cubic-bezier(.36,.07,.19,.97);
      }

      @keyframes errShake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(4px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
      }

      .err-msg.show { display: flex; }

      /* Footer */
      .box-footer {
        padding: 14px 36px 20px;
        border-top: 1px solid rgba(255,0,51,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .sec-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: rgba(255,100,130,0.5);
      }

      .sec-dot {
        width: 5px; height: 5px;
        background: var(--red);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--red);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.4; transform: scale(0.8); }
      }

      @media (max-width: 440px) {
        .box { margin: 0 12px; }
        .box-header, .box-body { padding-left: 24px; padding-right: 24px; }
        .box-footer { padding-left: 24px; padding-right: 24px; }
        .title { font-size: 24px; }
      }
    </style>
  
</head>
<body>

    <!-- Corner brackets -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Particles -->
    <div class="particles" id="pts"></div>

    <div class="box">
      <div class="accent-bar"></div>
      <div class="box-header">
        <div class="lock-wrap">
          <span class="lock-icon">🔒</span>
        </div>
        <div class="title">Conteúdo Protegido</div>
        <p class="subtitle">Digite a senha para desbloquear este projeto</p>
      </div>
      <div class="box-body">
        <div class="field-label">Senha de Acesso</div>
        <div class="inp-wrap">
          <input type="password" id="pw" placeholder="Digite a senha..." autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
          <button class="eye-btn" onclick="var i=document.getElementById('pw');i.type=i.type==='password'?'text':'password'">👁</button>
        </div>
        <button class="btn-unlock" onclick="unlock()">🔓 Desbloquear</button>
        <div class="err-msg" id="err">
          <span>⛔</span>
          <span>Senha incorreta. Tente novamente.</span>
        </div>
      </div>
      <div class="box-footer">
        <div class="sec-badge">
          <span class="sec-dot"></span>
          AES-256-GCM · Argon2id · Criptografia Militar
        </div>
      </div>
    </div>

    <script>
      // Generate floating particles
      (function(){
        var c=document.getElementById('pts');
        for(var i=0;i<22;i++){
          var p=document.createElement('div');
          p.className='p';
          p.style.left=Math.random()*100+'%';
          p.style.width=p.style.height=(Math.random()*3+1)+'px';
          var d=Math.random()*8+6;
          p.style.animationDuration=d+'s';
          p.style.animationDelay=(Math.random()*d)+'s';
          c.appendChild(p);
        }
      })();
    </script>

async function deriveKey(pass,salt){
  const h=await argon2.hash({pass,salt,time:4,mem:131072,hashLen:32,parallelism:2,type:argon2.ArgonType.Argon2id});
  return crypto.subtle.importKey("raw",h.hash,{name:"AES-GCM"},false,["decrypt"]);
}

async function unlock(){
  const pw=document.getElementById("pw").value;
  if(!pw)return;
  const btn=document.querySelector(".btn-unlock");
  if(btn){btn.textContent="⏳ Verificando...";btn.disabled=true;}
  try{
    const salt=Uint8Array.from(atob(DATA.s),c=>c.charCodeAt(0));
    const iv=Uint8Array.from(atob(DATA.iv),c=>c.charCodeAt(0));
    const enc=Uint8Array.from(atob(DATA.d),c=>c.charCodeAt(0));
    const key=await deriveKey(pw,salt);
    const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,enc);
    const code=new TextDecoder().decode(dec);
    document.addEventListener("contextmenu",e=>e.preventDefault());
setInterval(()=>console.clear(),1000);
setInterval(()=>{if(window.outerWidth-window.innerWidth>200||window.outerHeight-window.innerHeight>200){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0005;color:#ff0033;font-family:monospace;font-size:18px">⛔ Acesso bloqueado</div>';}},500);
    const f=document.createElement("iframe");
    f.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;border:none";
    f.sandbox="allow-scripts allow-same-origin allow-forms allow-popups";
    document.body.innerHTML="";
    document.body.appendChild(f);
    f.srcdoc=code;
  }catch(e){
    if(btn){btn.textContent="🔓 Desbloquear";btn.disabled=false;}
    const el=document.getElementById("err");
    if(el){
      el.classList.add("show");
      el.style.animation="none";
      void el.offsetWidth;
      el.style.animation="errShake 0.4s cubic-bezier(.36,.07,.19,.97)";
    }
    else{alert("Senha incorreta");}
    document.getElementById("pw").value="";
    document.getElementById("pw").focus();
  }
}

document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
</script>
